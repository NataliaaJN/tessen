# Internal packages only. Nothing is published (ADR 0015): every package is
# `private: true` and shares code through `workspace:*`.
packages:
  - packages/*
  - apps/*
  - tooling/*
  - spikes/*
# `integration/*` is deliberately NOT a workspace member: it installs the
# packed tarballs like an external consumer would (ADR 0016).

# Single source of truth for third-party versions used by more than one package.
catalog:
  '@eslint/js': ^10.0.1
  '@testing-library/dom': ^10.4.2
  '@testing-library/user-event': ^14.6.13
  '@types/node': ^26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  dependency-cruiser: ^18.8.0
  eslint: ^10.15.0
  globals: ^17.14.0
  jsdom: ^31.0.1
  prettier: ^3.10.1
  react: ^19.3.1
  react-dom: ^19.3.1
  svgo: ^4.1.0
  style-dictionary: ^5.8.0
  turbo: ^2.11.13
  # Held on 6.0.x: typescript-eslint (<6.1) and dependency-cruiser (<7) do not support TS 7 yet.
  typescript: ~6.0.3
  typescript-eslint: ^8.73.0
  vite: ^8.3.8
  vue: ^3.5.46
  vitest: ^5.1.1
