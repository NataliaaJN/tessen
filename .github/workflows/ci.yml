name: CI

# Runs on pull requests and on pushes to the two long-lived branches.
# No release, deploy or publish workflow exists on purpose (ADR 0014 / 0015).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned by commit SHA (comment = the release it points to).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm tokens:check
      - run: pnpm deps:check
      - run: pnpm scope:check
      - run: pnpm licenses:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm parity:api
      - run: pnpm docs:check
      - run: pnpm size

      # Distribution as a consumer sees it (ADR 0016): pack, check the tarballs, install them
      # into integration/* and build those projects. Local files only, nothing is published.
      - run: pnpm pack:all
      - run: pnpm tarball:check
      - run: pnpm integration:install
      - run: pnpm integration:test
      # Hydration of the Next/Nuxt consumers in a real browser (Playwright's own Chromium).
      - run: pnpm --filter @tessen-ui/e2e exec playwright install --with-deps chromium
      - run: pnpm ssr:e2e
      - run: pnpm scope:check

  # Real browser (ADR 0004 C3) and Vue <-> React visual parity over the built packages.
  # Chromium is downloaded by Playwright on the runner; nothing is published.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@tessen-ui/vue --filter=@tessen-ui/react
      - run: pnpm --filter @tessen-ui/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-output
          path: tooling/e2e/.out
          retention-days: 7
