<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Button parity harness</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--tessen-color-surface-default);
        color: var(--tessen-color-text-primary);
        font-family: var(--tessen-font-family-sans);
      }
      /* Identical fixed-width panels so both frameworks lay out the very same way. */
      .panel {
        inline-size: 760px;
        padding: 16px;
        box-sizing: border-box;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-block-end: 12px;
      }
      .wide {
        inline-size: 100%;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h2>Vue</h2>
    <div id="vue" class="panel"></div>
    <h2>React</h2>
    <div id="react" class="panel"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
